<!--
  Vignette Toolbar — Dark/Light Toggle + Font Size Controls
  Source: ~/.claude/templates/vignette_toolbar.html
  Include via _quarto.yml: format: html: include-in-header: path/to/vignette_toolbar.html

  Features:
  - Dark mode toggle (default: dark, persists to localStorage)
  - Font size A-/A+ (2px steps, persists to localStorage)
  - Respects OS preference on first visit
  - Propagates to Shinylive iframes

  IMPORTANT -- this CSS is DUPLICATED in pkgdown/extra.css. Keep both in
  sync when editing. Why both exist:

  pkgdown::build_site() silently DROPS this <style> block, site-wide, on
  every page it renders directly (14 of 19 vignettes) -- confirmed by
  grepping the built HTML for "#vignette-toolbar {": on a pkgdown-built
  page it's absent; the <script> half below (plain JS text) survives fine.
  Root cause is the same include-in-header vs. pkgdown's --output-dir
  override fragility documented in vignettes/_quarto.yml's `render:`
  comment. Symptom when this <style> block is the ONLY copy: the toolbar
  (dark/light toggle, A-/A+) renders unstyled at the bottom of the page
  instead of pinned top-right, and body.dark-mode's background/text
  overrides never apply (background falls back to Bootstrap's
  data-bs-theme=dark default #212529 instead of #000000).

  The 5 vignettes rendered via a dedicated `quarto render` target in
  plan_site_build.R (quiz_shinylive, chronic_quiz_shinylive,
  ranking_quiz_shinylive, portfolio_shinylive, chronic_vs_acute) -- plus
  details (site_details target, added because pkgdown's build_site() also
  mangles its .panel-tabset markup) -- are standalone quarto documents:
  they never go through pkgdown's template at all, so they never link
  pkgdown/extra.css either. For THOSE 6 pages, this <style> block (which
  a direct `quarto render` keeps intact) is the ONLY copy that applies.

  So: pkgdown-built pages need the pkgdown/extra.css copy; the 6 standalone
  quarto-rendered pages need this copy. Neither file can be deleted in
  favour of the other without breaking one of the two page classes.
-->
<style>
/* ===== Toolbar Container ===== */
#vignette-toolbar {
  position: fixed;
  top: 8px;
  right: 12px;
  z-index: 10000;
  display: flex;
  gap: 6px;
  background: rgba(128, 128, 128, 0.15);
  padding: 4px 8px;
  border-radius: 20px;
  backdrop-filter: blur(4px);
}

#vignette-toolbar button {
  font-size: 16px;
  background: none;
  border: 1px solid #888;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  cursor: pointer;
  padding: 0;
  line-height: 30px;
  text-align: center;
  transition: background-color 0.2s, color 0.2s;
}

#vignette-toolbar button:hover {
  background-color: rgba(128, 128, 128, 0.3);
}

#vignette-toolbar button:focus {
  outline: 2px solid #4ea8de;
  outline-offset: 2px;
}

/* Light mode button colors */
body:not(.dark-mode) #vignette-toolbar button {
  color: #333;
  border-color: #666;
}

/* Dark mode button colors */
body.dark-mode #vignette-toolbar button {
  color: #eee;
  border-color: #888;
}

/* ===== Dark Mode Styles ===== */
body.dark-mode, html.dark-mode {
  background-color: #000000 !important;
  color: #ffffff !important;
}

body.dark-mode h1, body.dark-mode h2, body.dark-mode h3, body.dark-mode h4,
body.dark-mode p, body.dark-mode li, body.dark-mode td, body.dark-mode th,
body.dark-mode code, body.dark-mode pre, body.dark-mode blockquote,
body.dark-mode .quarto-title, body.dark-mode #title-block-header {
  color: #ffffff !important;
}

/* NOT !important (WCAG AA fix, this session): plain <a> tags in prose
   still get this color by cascade (body.dark-mode a has higher element
   count than a bare .some-class selector), but page-specific link-color
   fixes with >=2 classes -- e.g. micromort-quiz.qmd's
   ".quiz-btn-correct .help-link { color: #0a58ca }", tuned in WCAG sweep
   #125/#128 for a *light* revealed-answer background -- now correctly win
   by specificity instead of being clobbered by !important. Before this
   session, this collision was invisible because pkgdown::build_site()
   silently dropped this whole <style> block on 14 of 19 pages (see the
   top-of-file note); fixing that drop is what surfaced the collision. */
body.dark-mode a { color: #4ea8de; }
body.dark-mode a:visited { color: #9d7cd8; }

body.dark-mode .callout, body.dark-mode .card, body.dark-mode .sidebar,
body.dark-mode nav, body.dark-mode header, body.dark-mode footer {
  background-color: #1a1a1a !important;
  color: #ffffff !important;
}

body.dark-mode table {
  background-color: #1a1a1a !important;
}

body.dark-mode tr:nth-child(even) {
  background-color: #2a2a2a !important;
}

body.dark-mode code {
  background-color: #2a2a2a !important;
}

body.dark-mode pre {
  background-color: #1a1a1a !important;
  border-color: #444 !important;
}

/* Override any inline light backgrounds */
body.dark-mode [style*="background:#fff"],
body.dark-mode [style*="background:#f8"],
body.dark-mode [style*="background:#d1e"],
body.dark-mode [style*="background: #fff"],
body.dark-mode [style*="background: #f8"],
body.dark-mode [style*="background: #d1e"],
body.dark-mode [style*="background-color:#fff"],
body.dark-mode [style*="background-color:#f8"],
body.dark-mode [style*="background-color:#d1e"],
body.dark-mode [style*="background-color: #fff"],
body.dark-mode [style*="background-color: #f8"],
body.dark-mode [style*="background-color: #d1e"] {
  background: #000000 !important;
  color: #ffffff !important;
}

/* Shinylive iframe dark mode */
body.dark-mode .shinylive-wrapper,
body.dark-mode .shinylive-container,
body.dark-mode iframe {
  background-color: #1a1a1a !important;
}

/* ===== Accessible Color Overrides (>=4.5:1 on #000) ===== */
body.dark-mode .text-success { color: #69d4a0 !important; }
body.dark-mode .text-danger { color: #f08080 !important; }
body.dark-mode .text-info { color: #5edaff !important; }
body.dark-mode .text-primary { color: #4ea8de !important; }

/* WCAG AA fix (this session): .alert-success/.alert-danger/.alert-info and
   .badge.bg-success/.badge.bg-danger are FILLED elements with their own
   saturated bootswatch-flatly background (colors are theme constants, not
   affected by dark/light mode) -- text inside them must contrast against
   THAT background, not the page background, so they are deliberately
   excluded from the .text-* rule above (which assumes the page's #000
   background). bootswatch flatly's own un-overridden default (white text)
   measures only 2.41-3.82:1 against these backgrounds -- also fails AA.
   Measured replacement: #000000 vs #e74c3c (danger) = 5.50:1, vs #18bc9c
   (success) = 8.71:1, vs #3498db (alert-info) = 6.66:1. .alert-primary is
   left on its bootswatch default (white on #2c3e50 = 10.98:1, already
   passes); no .badge.bg-info/.badge.bg-primary usage found to check. */
body.dark-mode .alert-success,
body.dark-mode .alert-danger,
body.dark-mode .alert-info,
body.dark-mode .badge.bg-success,
body.dark-mode .badge.bg-danger {
  color: #000000 !important;
}

/* WCAG AA fix (this session): .explanation-panel sets its own light
   background (#f8f9fa) and dark text (#212529) for the quiz explanation
   card, but the blanket "body.dark-mode p { color: #fff !important }"
   rule above directly targets <p> elements and wins over the panel's
   inherited color (a direct rule always beats an inherited one,
   regardless of !important) -- so text inside routinely rendered
   near-invisible white-on-#f8f9fa (~1.05:1). This restores the panel's
   own #212529 (14.63:1 on #f8f9fa, from WCAG sweep #125/#128). */
body.dark-mode .explanation-panel,
body.dark-mode .explanation-panel p,
body.dark-mode .explanation-panel strong {
  color: #212529 !important;
}

/* WCAG AA fix (this session): bootswatch flatly's own .btn-secondary /
   .badge.bg-secondary background (#95a5a6) with white text measures only
   2.56:1. Darkened background (border matched) measures 5.94:1 with the
   same white text. */
body.dark-mode .btn-secondary,
body.dark-mode .badge.bg-secondary {
  background-color: #5a6668 !important;
  border-color: #5a6668 !important;
}

/* WCAG AA fix (this session): the quiz pages' own QR-code URL text
   (.qr-section .qr-url, color #495057) was tuned for a light page
   background; against this site's actual dark-mode container background
   it measured 2.13:1. #adb5bd measures 8.39:1. */
body.dark-mode .qr-section .qr-url {
  color: #adb5bd !important;
}

/* WCAG AA fix (this session): Quarto's `.panel-tabset` (used by the
   Details page, articles/details.html) renders standard Bootstrap
   .nav-tabs markup. The site already had a dark-mode fix for these, but
   keyed on [data-bs-theme="dark"] -- an attribute set by PKGDOWN's own
   lightswitch.js, which only loads on pkgdown::build_site()-rendered
   pages, never on this file's own 6 standalone quarto-rendered pages
   (including details.html). Re-keyed on .dark-mode (set by THIS file's
   own toggle, present on every page) so it works everywhere a tabset
   might appear. */
body.dark-mode .nav-tabs .nav-link.active,
body.dark-mode .nav-tabs .nav-link.active:focus,
body.dark-mode .nav-tabs .nav-link.active:hover {
  color: #ffffff !important;
  background-color: #2b3e50 !important;
  border-color: #444 #444 transparent !important;
}

body.dark-mode .nav-tabs .nav-link {
  color: #adb5bd !important;
}

body.dark-mode .nav-tabs .nav-link:hover {
  color: #ffffff !important;
  border-color: #555 #555 transparent !important;
}

body.dark-mode .nav-tabs {
  border-bottom-color: #444 !important;
}

body.dark-mode .tab-content {
  color: #e0e0e0;
}

/* WCAG AA fix (this session): Bootstrap/bootswatch-flatly's
   .btn-outline-primary uses the light-theme "primary" color (#2c3e50) for
   text+border. Against this dark background that measures ~1.9:1 --
   near-invisible (e.g. the "View Details" button on the quiz results
   screens). #8bb9fe (already used for .help-link on the same quiz pages)
   measures 10.47:1. Kept in sync with the matching rule in
   pkgdown/extra.css. */
body.dark-mode .btn-outline-primary {
  color: #8bb9fe;
  border-color: #8bb9fe;
}

body.dark-mode .btn-outline-primary:hover,
body.dark-mode .btn-outline-primary:focus {
  color: #212529;
  background-color: #8bb9fe;
  border-color: #8bb9fe;
}
</style>

<script>
(function() {
  'use strict';

  var STORAGE_THEME = 'vignette-dark-mode';
  var STORAGE_FONT = 'vignette-font-size';
  var BASE_FONT = 16;
  var FONT_STEP = 2;
  var MIN_FONT = 12;
  var MAX_FONT = 24;

  // ===== Theme Management =====
  function getPreferredTheme() {
    var saved = localStorage.getItem(STORAGE_THEME);
    if (saved !== null) return saved === 'true';
    // Default to dark, but respect OS preference if explicitly light
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
      return false;
    }
    return true; // Default dark
  }

  function applyTheme(isDark) {
    if (isDark) {
      document.documentElement.classList.add('dark-mode');
      document.body && document.body.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
      document.body && document.body.classList.remove('dark-mode');
    }
    localStorage.setItem(STORAGE_THEME, isDark);
    updateThemeButton(isDark);
    propagateToIframes(isDark);
  }

  function updateThemeButton(isDark) {
    var btn = document.getElementById('theme-toggle');
    if (btn) {
      btn.textContent = isDark ? '\u2600' : '\u263E'; // ☀ or ☾
      btn.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
    }
  }

  function toggleTheme() {
    var isDark = document.documentElement.classList.contains('dark-mode');
    applyTheme(!isDark);
  }

  function propagateToIframes(isDark) {
    document.querySelectorAll('iframe').forEach(function(f) {
      try {
        var doc = f.contentDocument || f.contentWindow.document;
        if (isDark) {
          doc.body.classList.add('dark-mode');
          doc.documentElement.classList.add('dark-mode');
        } else {
          doc.body.classList.remove('dark-mode');
          doc.documentElement.classList.remove('dark-mode');
        }
      } catch(e) { /* cross-origin iframe */ }
    });
  }

  // ===== Font Size Management =====
  function getSavedFontSize() {
    var saved = localStorage.getItem(STORAGE_FONT);
    return saved ? parseInt(saved, 10) : BASE_FONT;
  }

  function applyFontSize(size) {
    size = Math.max(MIN_FONT, Math.min(MAX_FONT, size));
    document.documentElement.style.fontSize = size + 'px';
    localStorage.setItem(STORAGE_FONT, size);
    return size;
  }

  function changeFontSize(delta) {
    var current = getSavedFontSize();
    applyFontSize(current + delta);
  }

  // ===== Apply Immediately (before DOM ready) =====
  applyTheme(getPreferredTheme());
  applyFontSize(getSavedFontSize());

  // ===== Create Toolbar on DOM Ready =====
  document.addEventListener('DOMContentLoaded', function() {
    // Apply theme to body now that it exists
    applyTheme(getPreferredTheme());

    var toolbar = document.createElement('div');
    toolbar.id = 'vignette-toolbar';
    toolbar.setAttribute('role', 'toolbar');
    toolbar.setAttribute('aria-label', 'Page display controls');

    // Theme toggle
    var themeBtn = document.createElement('button');
    themeBtn.id = 'theme-toggle';
    themeBtn.title = 'Toggle dark/light mode';
    themeBtn.onclick = toggleTheme;
    var isDark = document.documentElement.classList.contains('dark-mode');
    themeBtn.textContent = isDark ? '\u2600' : '\u263E';
    themeBtn.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');

    // Font decrease
    var fontDown = document.createElement('button');
    fontDown.id = 'font-decrease';
    fontDown.title = 'Decrease font size';
    fontDown.textContent = 'A\u2212'; // A−
    fontDown.setAttribute('aria-label', 'Decrease font size');
    fontDown.onclick = function() { changeFontSize(-FONT_STEP); };

    // Font increase
    var fontUp = document.createElement('button');
    fontUp.id = 'font-increase';
    fontUp.title = 'Increase font size';
    fontUp.textContent = 'A+';
    fontUp.setAttribute('aria-label', 'Increase font size');
    fontUp.onclick = function() { changeFontSize(FONT_STEP); };

    toolbar.appendChild(themeBtn);
    toolbar.appendChild(fontDown);
    toolbar.appendChild(fontUp);
    document.body.appendChild(toolbar);

    // Re-propagate to iframes that loaded after initial apply
    setTimeout(function() { propagateToIframes(getPreferredTheme()); }, 1000);
  });
})();
</script>
