name: Leaderboard Stats Refresh

on:
  schedule:
    # Two crons so a new submission is counted within a day, not a week:
    #  - Monday 06:00 UTC: full run, including the weekly email report.
    #  - Every other day 06:00 UTC: refresh stats + deploy only. The
    #    "Send email report" step is gated on github.event.schedule
    #    (must match this second cron string exactly) so it stays silent.
    - cron: '0 6 * * 1'
    - cron: '0 6 * * 0,2-6'
  workflow_dispatch:

permissions:
  contents: write
  # gh workflow run pkgdown.yaml (see "Trigger Pages deploy" step)
  actions: write

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          logger: pretty
          log-directives: nix_installer=trace
          backtrace: full

      - name: Setup magic Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Setup Cachix (rstats-on-nix + johngavin)
        uses: cachix/cachix-action@v15
        with:
          name: rstats-on-nix
          extraPullNames: johngavin

      - name: Build development environment
        run: nix-build default.nix -A shell --no-out-link

      - name: Refresh leaderboard stats
        run: |
          nix-shell default.nix -A shell --run "Rscript -e '
            targets::tar_make(names = c(\"leaderboard_raw\", \"leaderboard_stats_json\"))
          '"

      - name: Generate email report
        id: report
        run: |
          nix-shell default.nix -A shell --run "Rscript -e '
            df <- targets::tar_read(leaderboard_raw)
            if (nrow(df) == 0 || !\"timestamp\" %in% names(df)) {
              cat(\"SEND_EMAIL=false\n\", file = Sys.getenv(\"GITHUB_OUTPUT\"))
              quit(save = \"no\")
            }

            df\$ts <- as.POSIXct(df\$timestamp, format = \"%Y-%m-%dT%H:%M:%S\", tz = \"UTC\")
            now <- Sys.time()
            week_breaks <- now - as.difftime(c(0, 1, 2, 3, 4) * 7, units = \"days\")

            week1 <- sum(df\$ts >= week_breaks[2] & df\$ts < week_breaks[1], na.rm = TRUE)
            week2 <- sum(df\$ts >= week_breaks[3] & df\$ts < week_breaks[2], na.rm = TRUE)
            week3 <- sum(df\$ts >= week_breaks[4] & df\$ts < week_breaks[3], na.rm = TRUE)
            week4 <- sum(df\$ts >= week_breaks[5] & df\$ts < week_breaks[4], na.rm = TRUE)

            if (week1 == 0) {
              cat(\"SEND_EMAIL=false\n\", file = Sys.getenv(\"GITHUB_OUTPUT\"))
              quit(save = \"no\")
            }

            # Count by quiz type this week
            this_week <- df[df\$ts >= week_breaks[2] & df\$ts < week_breaks[1], ]
            acute_n <- sum(this_week\$quiz_type == \"acute\", na.rm = TRUE)
            chronic_n <- sum(this_week\$quiz_type == \"chronic\", na.rm = TRUE)
            ranking_n <- sum(this_week\$quiz_type == \"ranking\", na.rm = TRUE)

            stats <- targets::tar_read(leaderboard_stats_json)

            # Quiz links
            base_url <- \"https://johngavin.github.io/micromort/articles\"
            quiz_links <- paste0(
              \"Quiz links:\\n\",
              \"  Acute:   \", base_url, \"/micromort-quiz.html\\n\",
              \"  Chronic: \", base_url, \"/microlife-quiz.html\\n\",
              \"  Ranking: \", base_url, \"/risk-ranking-quiz.html\\n\"
            )

            # Overall totals
            total_all <- stats\$acute_n + stats\$chronic_n + stats\$ranking_n

            body <- paste0(
              \"Micromort Quiz Leaderboard — Weekly Report\\n\",
              \"==========================================\\n\\n\",
              quiz_links, \"\\n\",
              \"Overall\\n\",
              \"-------\\n\",
              \"Total submissions (all quizzes): \", total_all, \"\\n\",
              \"This week: \", week1, \" | 1w ago: \", week2, \" | 2w ago: \", week3, \" | 3w ago: \", week4, \"\\n\\n\",
              \"By quiz\\n\",
              \"-------\\n\",
              \"  Acute:   \", stats\$acute_n, \" total | \", acute_n, \" this week\\n\",
              \"  Chronic: \", stats\$chronic_n, \" total | \", chronic_n, \" this week\\n\",
              \"  Ranking: \", stats\$ranking_n, \" total | \", ranking_n, \" this week\\n\\n\",
              \"Stats JSON updated at: \", format(now, \"%Y-%m-%d %H:%M UTC\"), \"\\n\"
            )

            cat(\"SEND_EMAIL=true\n\", file = Sys.getenv(\"GITHUB_OUTPUT\"))
            writeLines(body, \"email_body.txt\")
            cat(body)
          '"

      - name: Commit updated stats
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/api/quiz_stats.json
          # generated_at changes on every run, so a plain "did the file
          # change" test would commit (and redeploy) daily even with no new
          # submissions. Ignore hunks made only of generated_at lines
          # (-I): exit 0 = nothing else changed, 1 = real change.
          # --exit-code (not --quiet) so -I is honoured on every git version.
          rc=0
          git diff --cached --exit-code --no-ext-diff -I'"generated_at"' > /dev/null || rc=$?
          if [ "$rc" -eq 1 ]; then
            git commit -m "chore: Refresh leaderboard stats [automated]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 0 ]; then
            echo "Only generated_at changed; not committing or deploying."
            git restore --staged docs/api/quiz_stats.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::git diff exited $rc; cannot tell whether stats changed"
            exit "$rc"
          fi

      # Pushes made with the default GITHUB_TOKEN deliberately do NOT trigger
      # other workflows, so the push above never fires pkgdown.yaml's
      # `push: paths: docs/**` trigger and the refreshed JSON was never
      # deployed to Pages (the live JSON stayed weeks stale). A
      # workflow_dispatch run IS exempt from that restriction, so dispatch
      # the Pages deploy explicitly. Requires `actions: write` above.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pkgdown.yaml --ref main

      - name: Send email report
        if: steps.report.outputs.SEND_EMAIL == 'true' && github.event.schedule != '0 6 * * 0,2-6'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Micromort Quiz — Weekly Leaderboard Report"
          to: ${{ secrets.EMAIL_RECIPIENT }}
          from: "Micromort Bot <${{ secrets.EMAIL_USERNAME }}>"
          body: file://email_body.txt
