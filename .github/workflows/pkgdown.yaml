name: Deploy pkgdown to GitHub Pages

# Per 9-step workflow:
# 1. Build locally with pkgdown::build_site()
# 2. Commit docs/ directory
# 3. Push to GitHub
# 4. This workflow deploys the pre-built docs/
#
# This saves CI quota and ensures fast, predictable deployments.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "_pkgdown.yml"
      - "pkgdown/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Verify pre-built docs exist
        run: |
          if [ ! -f "docs/index.html" ]; then
            echo "ERROR: docs/index.html not found!"
            echo "You must build locally with pkgdown::build_site() and commit docs/"
            exit 1
          fi
          echo "Pre-built docs/ found:"
          ls -la docs/*.html | head -10

      - name: Install pyyaml for _pkgdown.yml parsing
        run: pip install pyyaml

      - name: Verify all articles exist in docs/
        run: |
          ERRORS=0
          # Parse articles: contents: from _pkgdown.yml (authoritative; includes Shinylive pages)
          # Also union in navbar href: patterns as a fallback
          ARTICLE_SLUGS=$(python3 -c "
          import sys, re, yaml
          with open('_pkgdown.yml') as f:
              cfg = yaml.safe_load(f)
          slugs = set()
          for section in cfg.get('articles', []):
              for item in section.get('contents', []):
                  if isinstance(item, str):
                      slugs.add(item + '.html')
          # Also capture navbar href: patterns
          with open('_pkgdown.yml') as f:
              text = f.read()
          for m in re.findall(r'articles/([A-Za-z0-9_-]+)\.html', text):
              slugs.add(m + '.html')
          print('\n'.join(sorted(slugs)))
          ")
          for article in $ARTICLE_SLUGS; do
            if [ ! -f "docs/articles/$article" ]; then
              echo "MISSING: docs/articles/$article (listed in _pkgdown.yml)"
              ERRORS=$((ERRORS + 1))
            else
              echo "OK: docs/articles/$article"
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "::error::$ERRORS article(s) in _pkgdown.yml missing from docs/"
            exit 1
          fi
          echo "All articles verified"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed URLs return 200
        if: success()
        run: |
          SITE_URL="${{ steps.deployment.outputs.page_url }}"
          # Strip trailing slash
          SITE_URL="${SITE_URL%/}"
          ERRORS=0

          # Check index
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}/index.html")
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: ${SITE_URL}/index.html returned $STATUS"
            ERRORS=$((ERRORS + 1))
          else
            echo "OK: index.html ($STATUS)"
          fi

          # Check every article (navbar + articles: contents:)
          for article in $(python3 -c "
          import re, yaml
          with open('_pkgdown.yml') as f:
              cfg = yaml.safe_load(f)
          slugs = set()
          for section in cfg.get('articles', []):
              for item in section.get('contents', []):
                  if isinstance(item, str):
                      slugs.add('articles/' + item + '.html')
          with open('_pkgdown.yml') as f:
              text = f.read()
          for m in re.findall(r'articles/([A-Za-z0-9_-]+)\.html', text):
              slugs.add('articles/' + m + '.html')
          print('\n'.join(sorted(slugs)))
          "); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}/${article}" --retry 2 --retry-delay 5)
            if [ "$STATUS" != "200" ]; then
              echo "FAIL: ${SITE_URL}/${article} returned $STATUS"
              ERRORS=$((ERRORS + 1))
            else
              echo "OK: ${article} ($STATUS)"
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "::error::$ERRORS deployed URL(s) returned non-200 status"
            exit 1
          else
            echo "All deployed URLs verified (HTTP 200)"
          fi

      - name: Check deployed HTML for error patterns
        if: success()
        run: |
          SITE_URL="${{ steps.deployment.outputs.page_url }}"
          SITE_URL="${SITE_URL%/}"
          ERRORS=0
          sleep 15
          # Skip articles that can't be rebuilt by pkgdown (Closeread, Shinylive)
          SKIP="chronic_vs_acute.html portfolio_shinylive.html"
          ALL_ARTICLES=$(python3 -c "
          import re, yaml
          with open('_pkgdown.yml') as f:
              cfg = yaml.safe_load(f)
          slugs = set()
          for section in cfg.get('articles', []):
              for item in section.get('contents', []):
                  if isinstance(item, str):
                      slugs.add('articles/' + item + '.html')
          with open('_pkgdown.yml') as f:
              text = f.read()
          for m in re.findall(r'articles/([A-Za-z0-9_-]+)\.html', text):
              slugs.add('articles/' + m + '.html')
          print('\n'.join(sorted(slugs)))
          ")
          for article in $ALL_ARTICLES; do
            BASENAME=$(basename "$article")
            if echo "$SKIP" | grep -q "$BASENAME"; then
              echo "SKIP: ${article} (Closeread/Shinylive)"
              continue
            fi
            URL="${SITE_URL}/${article}"
            CONTENT=$(curl -s --retry 3 --retry-delay 10 "$URL")
            # Patterns match placeholder text from inst/vignette_utils.R show_target()
            # and safe_tar_read() — keep in sync with plan_qa_gates.R qa_deployed_html
            for pattern in \
              "requires \`tar_make()\` to render" \
              "requires tar_make() to" \
              "not found in targets store or RDS fallback" \
              "MISSING EVIDENCE"; do
              COUNT=$(echo "$CONTENT" | grep -ci "$pattern" || true)
              if [ "$COUNT" -gt 0 ]; then
                echo "::error::${article}: ${COUNT} hits for '${pattern}'"
                ERRORS=$((ERRORS + COUNT))
              fi
            done
          done
          if [ $ERRORS -gt 0 ]; then
            echo "::error::${ERRORS} error pattern(s) found in deployed HTML"
            exit 1
          fi
          echo "All deployed articles pass content QA"
