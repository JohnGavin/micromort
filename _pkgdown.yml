url: https://johngavin.github.io/micromort/

template:
  bootstrap: 5
  bootswatch: flatly
  light-switch: true
  includes:
    in_header: >
      <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  bslib:
    code-fold: true
    code-summary: "Show code"

home:
  title: Micromort - Curated Risk Datasets
  description: >
    A data package providing curated datasets of micromort (acute risk)
    and microlife (chronic risk) values from authoritative sources.
  opengraph:
    image:
      src: man/figures/og-image.png
      alt: "Micromort risk comparison quiz showing a ladder of activities from coffee to Mt. Everest"

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: "Concepts"
      - text: "What is a Micromort?"
        href: articles/what-is-a-micromort.html
      - text: "Introduction"
        href: articles/introduction.html
      - text: "Palatable Units"
        href: articles/palatable_units.html
      - text: "---"
      - text: "Quizzes (instant | Shinylive)"
      - text: "☠️ Micromort: instant | Shinylive"
        href: articles/micromort-quiz.html
      - text: "⏳ Microlife: instant | Shinylive"
        href: articles/microlife-quiz.html
      - text: "📊 Ranking: instant | Shinylive"
        href: articles/risk-ranking-quiz.html
      - text: "🎯 Risk Portfolio Builder"
        href: articles/portfolio_shinylive.html
      - text: "📈 Your Quiz Analytics"
        href: articles/quiz_analytics.html
      - text: "---"
      - text: "Storytelling"
      - text: "The Invisible Risk (closeread)"
        href: articles/chronic_vs_acute.html
      - text: "🌍 Death Shares by Country"
        href: articles/death_shares_shinylive.html
      - text: "---"
      - text: "Analysis"
      - text: "Risk Equivalence"
        href: articles/risk_equivalence.html
      - text: "Regional Variation"
        href: articles/regional_variation.html
      - text: "Confounding Variables"
        href: articles/confounding.html
      - text: "Data Reliability"
        href: articles/data_reliability.html
      - text: "---"
      - text: "Developer"
      - text: "Architecture & Telemetry"
        href: articles/architecture.html
      - text: "REST API"
        href: articles/rest_api.html

